name: Discord release announcement

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to announce (test mode)'
        required: true
        default: 'v0.2.2'

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    steps:
      - name: Resolve release info
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.event.release.tag_name }}"
          fi

          json=$(gh release view "$tag" --repo "${{ github.repository }}" --json name,body,url,tagName,assets)
          name=$(echo "$json" | jq -r '.name // .tagName')
          url=$(echo  "$json" | jq -r '.url')
          body=$(echo "$json" | jq -r '.body')
          exe_name=$(echo "$json" | jq -r '.assets[]? | select(.name | endswith(".exe")) | .name' | head -n1)

          if [ "${#body}" -gt 4000 ]; then
            body="${body:0:3990}…（已截斷，完整內容請點 release 連結）"
          fi

          {
            echo "name=$name"
            echo "url=$url"
            echo "tag=$tag"
            echo "exe_name=$exe_name"
            echo "body<<RELEASE_BODY_EOF"
            echo "$body"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bundle exe into zip
        id: bundle
        if: ${{ steps.rel.outputs.exe_name != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _release
          gh release download "${{ steps.rel.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ steps.rel.outputs.exe_name }}" \
            --dir _release
          exe_name="${{ steps.rel.outputs.exe_name }}"
          zip_name="${exe_name%.exe}.zip"
          (cd _release && zip "$zip_name" "$exe_name")
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Send Discord embed (with attached zip)
        env:
          WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK_URL }}
          NAME:     ${{ steps.rel.outputs.name }}
          URL:      ${{ steps.rel.outputs.url }}
          BODY:     ${{ steps.rel.outputs.body }}
          ZIP_NAME: ${{ steps.bundle.outputs.zip_name }}
        run: |
          payload=$(jq -n \
            --arg title "$NAME" \
            --arg desc  "$BODY" \
            --arg url   "$URL"  \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                url: $url,
                color: 9024762,
                fields: [{ name: "📥 下載", value: "[前往 GitHub Release 下載](\($url))" }],
                footer: { text: "irusan-fanclub/mogugi" }
              }],
              allowed_mentions: { parse: [] }
            }')

          # Discord webhook attachments cap at ~8 MB (non-boosted). Attach the
          # zip only when it fits; otherwise post a text-only embed (the release
          # URL already links the downloads) so a large binary doesn't 413.
          max=8000000
          if [ -n "$ZIP_NAME" ] && [ -f "_release/$ZIP_NAME" ] && \
             [ "$(stat -c%s "_release/$ZIP_NAME")" -le "$max" ]; then
            curl -fsS -X POST \
              -F "payload_json=$payload;type=application/json" \
              -F "files[0]=@_release/$ZIP_NAME" \
              "$WEBHOOK"
          else
            curl -fsS -X POST -H "Content-Type: application/json" \
              -d "$payload" "$WEBHOOK"
          fi
