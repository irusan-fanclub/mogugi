name: Discord release announcement

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to announce (test mode)'
        required: true
        default: 'v0.2.2'
      json_only:
        description: 'Only rebuild mogugi/releases.json, no announcement'
        type: boolean
        default: false

permissions:
  contents: read

# R2 mirror of the release assets. GitHub serves attachments from Azure blob,
# which is slow from Taiwan; the mirror is a CDN copy, GitHub stays the source.
env:
  R2_BUCKET: elden-mogu-public
  R2_PREFIX: mogugi
  DL_BASE: https://cdn.elden-mogu.com

jobs:
  announce:
    runs-on: ubuntu-latest
    # Edits and json_only runs only refresh releases.json (job below).
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && !inputs.json_only) ||
          (github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false) }}
    env:
      R2_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
    steps:
      - name: Resolve release info
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.event.release.tag_name }}"
          fi

          json=$(gh release view "$tag" --repo "${{ github.repository }}" --json name,body,url,tagName,assets)
          name=$(echo "$json" | jq -r '.name // .tagName')
          url=$(echo  "$json" | jq -r '.url')
          body=$(echo "$json" | jq -r '.body')
          exe_name=$(echo "$json" | jq -r '.assets[]? | select(.name | endswith(".exe")) | .name' | head -n1)

          if [ "${#body}" -gt 4000 ]; then
            body="${body:0:3990}…（已截斷，完整內容請點 release 連結）"
          fi

          {
            echo "name=$name"
            echo "url=$url"
            echo "tag=$tag"
            echo "exe_name=$exe_name"
            echo "body<<RELEASE_BODY_EOF"
            echo "$body"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bundle exe into zip
        id: bundle
        if: ${{ steps.rel.outputs.exe_name != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _release
          gh release download "${{ steps.rel.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ steps.rel.outputs.exe_name }}" \
            --dir _release
          exe_name="${{ steps.rel.outputs.exe_name }}"
          zip_name="${exe_name%.exe}.zip"
          (cd _release && zip "$zip_name" "$exe_name")
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      # Skipped when the R2 secrets are absent, so the announcement still goes
      # out on an account that has no mirror configured.
      #
      # S3 API, not wrangler: wrangler's r2 commands go through Cloudflare's
      # REST API, which rejects bucket-scoped tokens — those are S3-only. See
      # https://developers.cloudflare.com/r2/api/tokens/
      - name: Mirror assets to R2
        id: mirror
        if: ${{ env.R2_KEY_ID != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # aws-cli v2 attaches a CRC32 checksum to every upload by default,
          # which R2 does not accept on all paths.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          mkdir -p _mirror
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --dir _mirror --pattern 'mogugi_*'

          put() {
            aws s3api put-object --endpoint-url "$ENDPOINT" \
              --bucket "$R2_BUCKET" --key "$1" --body "$2" \
              --content-type "$3" --cache-control "$4" >/dev/null
          }

          # Only the versioned copy exists: it never changes, so it caches
          # forever, and a post about vX keeps pointing at vX. No latest/ alias.
          exe_url=""; zip_url=""; exe_file=""; zip_file=""
          for f in _mirror/*; do
            name=$(basename "$f")
            case "$name" in
              *.exe) ct=application/vnd.microsoft.portable-executable ;;
              *.zip) ct=application/zip ;;
              *) continue ;;
            esac
            put "$R2_PREFIX/$TAG/$name" "$f" "$ct" "public, max-age=31536000, immutable"
            case "$name" in
              *.exe) exe_url="$DL_BASE/$R2_PREFIX/$TAG/$name"; exe_file="$name" ;;
              *.zip) zip_url="$DL_BASE/$R2_PREFIX/$TAG/$name"; zip_file="$name" ;;
            esac
          done

          {
            echo "exe_url=$exe_url"
            echo "zip_url=$zip_url"
            echo "exe_file=$exe_file"
            echo "zip_file=$zip_file"
          } >> "$GITHUB_OUTPUT"

      - name: Send Discord embed (with attached zip)
        env:
          WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK_URL }}
          NAME:     ${{ steps.rel.outputs.name }}
          URL:      ${{ steps.rel.outputs.url }}
          BODY:     ${{ steps.rel.outputs.body }}
          ZIP_NAME: ${{ steps.bundle.outputs.zip_name }}
          EXE_URL:  ${{ steps.mirror.outputs.exe_url }}
          ZIP_URL:  ${{ steps.mirror.outputs.zip_url }}
          EXE_FILE: ${{ steps.mirror.outputs.exe_file }}
          ZIP_FILE: ${{ steps.mirror.outputs.zip_file }}
        run: |
          if [ -n "$EXE_URL" ]; then
            dl=$(printf '[下載 %s](%s)\n[下載 %s](%s)\n備用：[GitHub Release](%s)' \
              "$EXE_FILE" "$EXE_URL" "$ZIP_FILE" "$ZIP_URL" "$URL")
          else
            dl="[前往 GitHub Release 下載]($URL)"
          fi

          payload=$(jq -n \
            --arg title "$NAME" \
            --arg desc  "$BODY" \
            --arg url   "$URL"  \
            --arg dl    "$dl"   \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                url: $url,
                color: 9024762,
                fields: [{ name: "📥 下載", value: $dl }],
                footer: { text: "irusan-fanclub/mogugi" }
              }],
              allowed_mentions: { parse: [] }
            }')

          # Discord webhook attachments cap at ~8 MB (non-boosted). Attach the
          # zip only when it fits; otherwise post a text-only embed (the release
          # URL already links the downloads) so a large binary doesn't 413.
          max=8000000
          if [ -n "$ZIP_NAME" ] && [ -f "_release/$ZIP_NAME" ] && \
             [ "$(stat -c%s "_release/$ZIP_NAME")" -le "$max" ]; then
            curl -fsS -X POST \
              -F "payload_json=$payload;type=application/json" \
              -F "files[0]=@_release/$ZIP_NAME" \
              "$WEBHOOK"
          else
            curl -fsS -X POST -H "Content-Type: application/json" \
              -d "$payload" "$WEBHOOK"
          fi

  # mogugi/releases.json feeds the 魔古工坊 release page. It is written after the
  # mirror step, so every download link in it already exists on R2. It never
  # blocks the announcement; a failure fails the run and alerts the private
  # ops channel through supermogugi.
  releases-json:
    needs: announce
    runs-on: ubuntu-latest
    # A publish and a quick edit must not race on the same object.
    concurrency:
      group: releases-json
      cancel-in-progress: false
    if: >-
      ${{ always() && needs.announce.result != 'cancelled' &&
          (github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false) }}
    env:
      R2_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      JSON_URL: https://cdn.elden-mogu.com/mogugi/releases.json
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Publish releases.json, purge its URL, verify
        if: ${{ env.R2_KEY_ID != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
        run: |
          set -euo pipefail
          script=.github/scripts/releases-json.mjs
          gh api --paginate "repos/${{ github.repository }}/releases" --jq '.[]' | jq -s . > gh.json
          aws s3api list-objects-v2 --endpoint-url "$ENDPOINT" --bucket "$R2_BUCKET" \
            --prefix "$R2_PREFIX/" --query 'Contents[].Key' --output text | tr '\t' '\n' > keys.txt
          node "$script" gh.json keys.txt > releases.json
          want=$(node "$script" --latest-gh gh.json)
          echo "newest published release: $want"

          attempt() {
            aws s3api put-object --endpoint-url "$ENDPOINT" --bucket "$R2_BUCKET" \
              --key "$R2_PREFIX/releases.json" --body releases.json \
              --content-type 'application/json; charset=utf-8' \
              --cache-control 'public, max-age=300' >/dev/null || return 1
            # Purge exactly the one URL the page reads; never the whole zone.
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CF_PURGE_TOKEN" -H 'Content-Type: application/json' \
              --data "{\"files\":[\"$JSON_URL\"]}" > purge.json || return 1
            [ "$(jq -r .success purge.json)" = "true" ] || { cat purge.json; return 1; }
            curl -fsS -H 'Cache-Control: no-cache' "$JSON_URL" -o live.json || return 1
            got=$(node "$script" --latest live.json)
            echo "live releases.json newest: $got"
            [ "$got" = "$want" ]
          }

          for i in 1 2 3; do
            if attempt; then echo "releases.json published"; exit 0; fi
            echo "::warning::releases.json attempt $i failed"
            sleep 10
          done
          echo "::error::releases.json was not published after 3 attempts"
          exit 1

      - name: Alert the ops channel
        if: ${{ failure() }}
        env:
          ALERT_KEY: ${{ secrets.MOGUGI_ALERT_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [ -n "$ALERT_KEY" ] || { echo "MOGUGI_ALERT_KEY not set; skipping alert"; exit 0; }
          body=$(jq -n --arg tag "$TAG" --arg url "$RUN_URL" \
            '{title: "mogugi releases.json 更新失敗", description: ("發佈頁可能停在舊版。版本：" + $tag), url: $url}')
          curl -fsS -m 15 -X POST https://mabinogi.elden-mogu.com/mogugi/ops/alert \
            -H "X-Alert-Key: $ALERT_KEY" -H 'Content-Type: application/json' -d "$body" \
            || echo "::warning::alert endpoint unreachable"
