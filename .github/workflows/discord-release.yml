name: Discord release announcement

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to announce (test mode)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    steps:
      - name: Resolve release info
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.event.release.tag_name }}"
          fi

          json=$(gh release view "$tag" --repo "${{ github.repository }}" --json name,body,url,tagName,assets)
          name=$(echo "$json" | jq -r '.name // .tagName')
          url=$(echo  "$json" | jq -r '.url')
          body=$(echo "$json" | jq -r '.body')

          # Both the bare exe and the zip are first-class downloads.
          exe_name=$(echo "$json" | jq -r '.assets[]? | select(.name | endswith(".exe")) | .name' | head -n1)
          zip_name=$(echo "$json" | jq -r '.assets[]? | select(.name | endswith(".zip")) | .name' | head -n1)

          dl_lines=""
          if [ -n "$exe_name" ]; then
            dl_lines="[$exe_name](https://github.com/${{ github.repository }}/releases/download/$tag/$exe_name)"
          fi
          if [ -n "$zip_name" ]; then
            zip_line="[$zip_name](https://github.com/${{ github.repository }}/releases/download/$tag/$zip_name)"
            if [ -n "$dl_lines" ]; then dl_lines="$dl_lines"$'\n'"$zip_line"; else dl_lines="$zip_line"; fi
          fi

          src_url="https://github.com/${{ github.repository }}/archive/refs/tags/$tag.zip"

          if [ "${#body}" -gt 4000 ]; then
            body="${body:0:3990}…（已截斷，完整內容請點 release 連結）"
          fi

          {
            echo "name=$name"
            echo "url=$url"
            echo "tag=$tag"
            echo "src_url=$src_url"
            echo "dl_lines<<DL_EOF"
            echo "$dl_lines"
            echo "DL_EOF"
            echo "body<<RELEASE_BODY_EOF"
            echo "$body"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Discord embed
        env:
          WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK_URL }}
          NAME:     ${{ steps.rel.outputs.name }}
          URL:      ${{ steps.rel.outputs.url }}
          BODY:     ${{ steps.rel.outputs.body }}
          TAG:      ${{ steps.rel.outputs.tag }}
          DL_LINES: ${{ steps.rel.outputs.dl_lines }}
          SRC_URL:  ${{ steps.rel.outputs.src_url }}
          # THUMB: drop a 256x256 PNG in the repo (e.g. icons/app-256.png)
          # then uncomment to embed it as the right-side thumbnail.
          # THUMB: https://raw.githubusercontent.com/${{ github.repository }}/master/icons/app-256.png
        run: |
          fields=$(jq -n \
            --arg dl  "$DL_LINES" \
            --arg tag "$TAG"      \
            --arg su  "$SRC_URL"  \
            '[
              (if $dl != "" then
                { name: "📥 下載", value: $dl, inline: true }
              else empty end),
              { name: "📦 原始碼", value: ("[" + $tag + ".zip](" + $su + ")"), inline: true }
            ]')

          payload=$(jq -n \
            --arg title    "$NAME" \
            --arg desc     "$BODY" \
            --arg url      "$URL"  \
            --argjson flds "$fields" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                url: $url,
                color: 9024762,
                fields: $flds,
                footer: { text: "irusan-fanclub/mabidilmeter" }
              }],
              allowed_mentions: { parse: [] }
            }')

          curl -fsS -X POST -H "Content-Type: application/json" \
               -d "$payload" "$WEBHOOK"
