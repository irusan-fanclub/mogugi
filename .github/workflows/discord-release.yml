name: Discord release announcement

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to announce (test mode)'
        required: true
        default: 'v0.2.2'
      json_only:
        description: 'Only rebuild mogugi/releases.json, no announcement'
        type: boolean
        default: false
      action:
        description: 'Announcement action (published posts anew, edited updates the post)'
        type: choice
        options: [published, edited]
        default: published

permissions:
  contents: read

# R2 mirror of the release assets. GitHub serves attachments from Azure blob,
# which is slow from Taiwan; the mirror is a CDN copy, GitHub stays the source.
env:
  R2_BUCKET: elden-mogu-public
  R2_PREFIX: mogugi
  DL_BASE: https://cdn.elden-mogu.com

jobs:
  announce:
    runs-on: ubuntu-latest
    # Release edits go through announce-edit; json_only runs only refresh
    # releases.json (job below).
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && !inputs.json_only) ||
          (github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false) }}
    env:
      R2_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
    steps:
      - name: Resolve release info
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_ACTION: ${{ inputs.action }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"; action="$INPUT_ACTION"
          else
            tag="$EVENT_TAG"; action=published
          fi
          gh release view "$tag" --repo "${{ github.repository }}" \
            --json name,body,url,tagName,assets > _rel.json
          {
            echo "tag=$tag"
            echo "action=$action"
          } >> "$GITHUB_OUTPUT"

      # Skipped when the R2 secrets are absent, so the announcement still goes
      # out on an account that has no mirror configured. An edit sends no
      # downloads, so it has nothing to mirror.
      #
      # S3 API, not wrangler: wrangler's r2 commands go through Cloudflare's
      # REST API, which rejects bucket-scoped tokens — those are S3-only. See
      # https://developers.cloudflare.com/r2/api/tokens/
      - name: Mirror assets to R2
        id: mirror
        if: ${{ env.R2_KEY_ID != '' && steps.rel.outputs.action == 'published' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # aws-cli v2 attaches a CRC32 checksum to every upload by default,
          # which R2 does not accept on all paths.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          mkdir -p _mirror
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --dir _mirror --pattern 'mogugi_*'

          put() {
            aws s3api put-object --endpoint-url "$ENDPOINT" \
              --bucket "$R2_BUCKET" --key "$1" --body "$2" \
              --content-type "$3" --cache-control "$4" >/dev/null
          }

          # Only the versioned copy exists: it never changes, so it caches
          # forever, and a post about vX keeps pointing at vX. No latest/ alias.
          exe_url=""; zip_url=""; exe_file=""; zip_file=""
          for f in _mirror/*; do
            name=$(basename "$f")
            case "$name" in
              *.exe) ct=application/vnd.microsoft.portable-executable ;;
              *.zip) ct=application/zip ;;
              *) continue ;;
            esac
            put "$R2_PREFIX/$TAG/$name" "$f" "$ct" "public, max-age=31536000, immutable"
            case "$name" in
              *.exe) exe_url="$DL_BASE/$R2_PREFIX/$TAG/$name"; exe_file="$name" ;;
              *.zip) zip_url="$DL_BASE/$R2_PREFIX/$TAG/$name"; zip_file="$name" ;;
            esac
          done

          {
            echo "exe_url=$exe_url"
            echo "zip_url=$zip_url"
            echo "exe_file=$exe_file"
            echo "zip_file=$zip_file"
          } >> "$GITHUB_OUTPUT"

      # supermogugi posts once per tag; the JSON is built by jq only, so
      # release text never touches the shell or the JSON syntax.
      - name: Announce via supermogugi
        env:
          ACTION: ${{ steps.rel.outputs.action }}
          TAG: ${{ steps.rel.outputs.tag }}
          EXE_URL: ${{ steps.mirror.outputs.exe_url }}
          ZIP_URL: ${{ steps.mirror.outputs.zip_url }}
          EXE_FILE: ${{ steps.mirror.outputs.exe_file }}
          ZIP_FILE: ${{ steps.mirror.outputs.zip_file }}
        run: |
          dl='[]'
          if [ "$ACTION" = "published" ]; then
            if [ -n "$EXE_URL$ZIP_URL" ]; then
              for pair in "$EXE_FILE|$EXE_URL" "$ZIP_FILE|$ZIP_URL"; do
                [ -n "${pair#*|}" ] || continue
                dl=$(jq -c --arg n "${pair%%|*}" --arg u "${pair#*|}" \
                  '. + [{name: $n, url: $u}]' <<<"$dl")
              done
            else
              # No mirror: fall back to the GitHub asset links.
              dl=$(jq -c '[.assets[]? | select(.name | endswith(".exe") or endswith(".zip"))
                | {name, url}] | .[:5]' _rel.json)
            fi
          fi

          payload=$(jq -n --arg action "$ACTION" --arg tag "$TAG" \
            --argjson dl "$dl" --slurpfile rel _rel.json '
            {action: $action, tag: $tag,
             name: (if ($rel[0].name // "") == "" then $tag else $rel[0].name end),
             body: ($rel[0].body // ""), url: $rel[0].url}
            | if $action == "published" then . + {downloads: $dl} else . end')

          curl -fsS -m 30 -X POST https://mabinogi.elden-mogu.com/mogugi/release \
            -H "X-Release-Key: ${{ secrets.MOGUGI_RELEASE_KEY }}" \
            -H 'Content-Type: application/json' -d "$payload"

      - name: Alert the ops channel
        if: ${{ failure() }}
        env:
          ALERT_KEY: ${{ secrets.MOGUGI_ALERT_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [ -n "$ALERT_KEY" ] || { echo "MOGUGI_ALERT_KEY not set; skipping alert"; exit 0; }
          body=$(jq -n --arg tag "$TAG" --arg url "$RUN_URL" \
            '{title: "mogugi 公告發送失敗", description: ("Discord 公告沒有發出。版本：" + $tag), url: $url}')
          curl -fsS -m 15 -X POST https://mabinogi.elden-mogu.com/mogugi/ops/alert \
            -H "X-Alert-Key: $ALERT_KEY" -H 'Content-Type: application/json' -d "$body" \
            || echo "::warning::alert endpoint unreachable"

  # A release edit updates the existing Discord post; no mirror, no new ping.
  announce-edit:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'release' && github.event.action == 'edited' && github.event.release.prerelease == false }}
    steps:
      - name: Announce the edit via supermogugi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" \
            --json name,body,url > _rel.json
          payload=$(jq -n --arg tag "$TAG" --slurpfile rel _rel.json '
            {action: "edited", tag: $tag,
             name: (if ($rel[0].name // "") == "" then $tag else $rel[0].name end),
             body: ($rel[0].body // ""), url: $rel[0].url}')
          curl -fsS -m 30 -X POST https://mabinogi.elden-mogu.com/mogugi/release \
            -H "X-Release-Key: ${{ secrets.MOGUGI_RELEASE_KEY }}" \
            -H 'Content-Type: application/json' -d "$payload"

      - name: Alert the ops channel
        if: ${{ failure() }}
        env:
          ALERT_KEY: ${{ secrets.MOGUGI_ALERT_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [ -n "$ALERT_KEY" ] || { echo "MOGUGI_ALERT_KEY not set; skipping alert"; exit 0; }
          body=$(jq -n --arg tag "$TAG" --arg url "$RUN_URL" \
            '{title: "mogugi 公告發送失敗", description: ("Discord 公告沒有更新。版本：" + $tag), url: $url}')
          curl -fsS -m 15 -X POST https://mabinogi.elden-mogu.com/mogugi/ops/alert \
            -H "X-Alert-Key: $ALERT_KEY" -H 'Content-Type: application/json' -d "$body" \
            || echo "::warning::alert endpoint unreachable"

  # mogugi/releases.json feeds the 魔古工坊 release page. It is written after the
  # mirror step, so every download link in it already exists on R2. It never
  # blocks the announcement; a failure fails the run and alerts the private
  # ops channel through supermogugi.
  releases-json:
    needs: [announce, announce-edit]
    runs-on: ubuntu-latest
    # A publish and a quick edit must not race on the same object.
    concurrency:
      group: releases-json
      cancel-in-progress: false
    if: >-
      ${{ always() && needs.announce.result != 'cancelled' && needs.announce-edit.result != 'cancelled' &&
          (github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false) }}
    env:
      R2_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      JSON_URL: https://cdn.elden-mogu.com/mogugi/releases.json
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Publish releases.json, purge its URL, verify
        if: ${{ env.R2_KEY_ID != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
        run: |
          set -euo pipefail
          script=.github/scripts/releases-json.mjs
          gh api --paginate "repos/${{ github.repository }}/releases" --jq '.[]' | jq -s . > gh.json
          aws s3api list-objects-v2 --endpoint-url "$ENDPOINT" --bucket "$R2_BUCKET" \
            --prefix "$R2_PREFIX/" --query 'Contents[].Key' --output text | tr '\t' '\n' > keys.txt
          node "$script" gh.json keys.txt > releases.json
          want=$(node "$script" --latest-gh gh.json)
          echo "newest published release: $want"

          attempt() {
            aws s3api put-object --endpoint-url "$ENDPOINT" --bucket "$R2_BUCKET" \
              --key "$R2_PREFIX/releases.json" --body releases.json \
              --content-type 'application/json; charset=utf-8' \
              --cache-control 'public, max-age=300' >/dev/null || return 1
            # Purge exactly the one URL the page reads; never the whole zone.
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CF_PURGE_TOKEN" -H 'Content-Type: application/json' \
              --data "{\"files\":[\"$JSON_URL\"]}" > purge.json || return 1
            [ "$(jq -r .success purge.json)" = "true" ] || { cat purge.json; return 1; }
            # Fetch as the site does: with its Origin. If the CDN caches this
            # copy, a reply without the CORS header would break the page.
            curl -fsS -D headers.txt -H 'Cache-Control: no-cache' \
              -H 'Origin: https://mabinogi.elden-mogu.com' "$JSON_URL" -o live.json || return 1
            grep -qi '^access-control-allow-origin:' headers.txt || { echo "no CORS header"; return 1; }
            got=$(node "$script" --latest live.json)
            echo "live releases.json newest: $got"
            [ "$got" = "$want" ] || return 1
            # An edit keeps the same tag, so also require this run's copy.
            [ "$(jq -r .generatedAt live.json)" = "$(jq -r .generatedAt releases.json)" ]
          }

          for i in 1 2 3; do
            if attempt; then echo "releases.json published"; exit 0; fi
            echo "::warning::releases.json attempt $i failed"
            sleep 10
          done
          echo "::error::releases.json was not published after 3 attempts"
          exit 1

      - name: Alert the ops channel
        if: ${{ failure() }}
        env:
          ALERT_KEY: ${{ secrets.MOGUGI_ALERT_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [ -n "$ALERT_KEY" ] || { echo "MOGUGI_ALERT_KEY not set; skipping alert"; exit 0; }
          body=$(jq -n --arg tag "$TAG" --arg url "$RUN_URL" \
            '{title: "mogugi releases.json 更新失敗", description: ("發佈頁可能停在舊版。版本：" + $tag), url: $url}')
          curl -fsS -m 15 -X POST https://mabinogi.elden-mogu.com/mogugi/ops/alert \
            -H "X-Alert-Key: $ALERT_KEY" -H 'Content-Type: application/json' -d "$body" \
            || echo "::warning::alert endpoint unreachable"
