<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>mogugi</title>
<style>
  :root {
    --c-bg: #16181d; --c-bg-deep: #0e1013; --c-surface: #1d2026; --c-surface-2: #252932;
    --c-line: #2c2f37; --c-text: #d6d9df; --c-text-dim: #7d838e; --c-accent: #e8a33d; --c-ok: #5fb878; --c-warn: #e0b040;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--c-bg); color: var(--c-text);
               font-family: "Microsoft JhengHei", "Segoe UI", sans-serif; font-size: 13px; user-select: none; }
  body { display: flex; flex-direction: column; }
  .tb { height: 32px; flex: none; display: flex; align-items: center; gap: 8px; padding-left: 12px; border-bottom: 1px solid var(--c-line); }
  .tb img { width: 16px; height: 16px; }
  .tb .name { font-weight: 700; }
  .tb .x { margin-left: auto; width: 44px; height: 32px; border: 0; background: transparent; color: var(--c-text-dim); font: inherit; font-size: 14px; cursor: pointer; }
  .tb .x:hover { background: #c42b1c; color: #fff; }
  .body { flex: 1; padding: 16px 20px 0; line-height: 1.7; }
  .head { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .head .warn { color: var(--c-warn); font-size: 16px; }
  .exes { display: grid; grid-template-columns: max-content 1fr; gap: 0 12px; align-items: baseline; padding: 8px 12px;
          background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 6px; margin-bottom: 10px; }
  .k { color: var(--c-text-dim); font-size: 12px; }
  .v { color: var(--c-accent); font-weight: 700; }
  .v.new { color: var(--c-ok); }
  .p { grid-column: 2; color: var(--c-text-dim); font-size: 12px; word-break: break-all; user-select: text; }
  hr { grid-column: 1 / -1; width: 100%; border: 0; border-top: 1px solid var(--c-line); margin: 6px 0; }
  kbd { padding: 0 5px; border: 1px solid var(--c-line); border-radius: 3px; background: var(--c-bg-deep); font: inherit; font-size: 12px; }
  .wait { display: flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--c-text-dim); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-warn); animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .foot { flex: none; display: flex; justify-content: flex-end; padding: 12px 20px 16px; }
  button.btn { height: 28px; padding: 0 16px; border-radius: 3px; border: 1px solid var(--c-line); background: var(--c-surface-2);
               color: var(--c-text); font: inherit; cursor: pointer; }
  button.btn:hover { border-color: var(--c-text-dim); }
</style>
</head>
<body>
  <div class="tb" id="tb">
    <img src="/icon.png" alt=""><span class="name">mogugi</span>
    <button class="x" type="button" title="取消" data-cancel>✕</button>
  </div>
  <div class="body">
    <div class="head"><span class="warn">⚠</span>已經有另一個 mogugi 在執行</div>
    <div class="exes">
      <span class="k">執行中</span><span class="v">v{{.Running.Version}}</span>
      <span class="p">{{if .Running.Path}}{{.Running.Path}}{{else}}（讀不到位置）{{end}}</span>
      <hr>
      <span class="k">剛開啟</span><span class="v new">v{{.Self.Version}}</span>
      <span class="p">{{.Self.Path}}</span>
    </div>
    <div>請在右下角系統匣的 mogugi 圖示上按右鍵 → <kbd>結束</kbd>，關閉後這個版本會自動啟動。</div>
    <div class="wait"><span class="dot"></span>等待執行中的 mogugi 關閉…</div>
  </div>
  <div class="foot"><button class="btn" type="button" data-cancel>取消</button></div>
<script>
  // Frameless window: the title bar drags it through the Wails host.
  document.getElementById('tb').addEventListener('mousedown', e => {
    if (e.button === 0 && !e.target.closest('button')) window.chrome?.webview?.postMessage('wails:drag');
  });
  for (const b of document.querySelectorAll('[data-cancel]')) {
    b.addEventListener('click', () => { fetch('/cancel', { method: 'POST' }); });
  }
</script>
</body>
</html>
